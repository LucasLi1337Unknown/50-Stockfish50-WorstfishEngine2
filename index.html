<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50% Stockfish + 50% Worstfish</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f4f6f8;font-family:system-ui,-apple-system,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}
h1{margin:0 0 6px}.muted{color:#aab3bd}
.layout{display:grid;grid-template-columns:minmax(300px,620px) 1fr;gap:22px;align-items:start}
.panel{background:#191e25;border:1px solid #303844;border-radius:18px;padding:16px}
.board-wrap{width:min(90vw,600px);aspect-ratio:1/1;margin:auto}
#board{
 width:100%;height:100%;display:grid;
 grid-template-columns:repeat(8,minmax(0,1fr));
 grid-template-rows:repeat(8,minmax(0,1fr));
 border:4px solid #3a424d;overflow:hidden;border-radius:10px
}
.square{
 width:100%;height:100%;min-width:0;min-height:0;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative;user-select:none;cursor:pointer;
 font-size:clamp(27px,6vw,57px);line-height:1
}
.light{background:#eee0c4}.dark{background:#76906f}
.selected{box-shadow:inset 0 0 0 5px #ffd35a}
.target::after{content:"";width:20%;height:20%;border-radius:50%;background:#1118;position:absolute}
.capture::after{content:"";inset:7%;border:5px solid #1118;border-radius:50%;position:absolute}
.piece{pointer-events:none;max-width:80%;max-height:80%;line-height:1}
.controls{display:grid;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
input[type=range]{width:100%}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
#reset{background:#69d69a;color:#07130c}
.status{padding:13px;background:#0d1116;border-radius:12px;min-height:92px;line-height:1.45}
.badge{padding:6px 10px;border-radius:999px;background:#303844;font-weight:800}
.good{color:#80e5a8;background:#173728}.bad{color:#ff9eac;background:#44232a}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🐟 Stockfish + Worstfish 🎲</h1>
<p class="muted">You are White. The engine is either brilliant or catastrophically bad.</p>
<div class="layout">
 <section class="panel"><div class="board-wrap"><div id="board"></div></div></section>
 <section class="panel controls">
  <div><div class="row"><b>Worstfish chance</b><b id="chanceText">50%</b></div><input id="chance" type="range" min="0" max="100" value="50"></div>
  <div><div class="row"><b>Depth</b><b id="depthText">10</b></div><input id="depth" type="range" min="5" max="16" value="10"></div>
  <div class="row"><span>Mode</span><span id="mode" class="badge">LOADING</span></div>
  <div id="status" class="status">Starting Stockfish…</div>
  <button id="reset">New Game</button>
  <div class="muted">Click a piece, then click a highlighted legal destination. Board squares are permanently fixed to an 8×8 grid.</div>
 </section>
</div>
</main>
<script>
const PIECE={P:"♙",N:"♘",B:"♗",R:"♖",Q:"♕",K:"♔",p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const board=document.getElementById("board"), status=document.getElementById("status"), mode=document.getElementById("mode");
const chance=document.getElementById("chance"), depth=document.getElementById("depth");
chance.oninput=()=>document.getElementById("chanceText").textContent=chance.value+"%";
depth.oninput=()=>document.getElementById("depthText").textContent=depth.value;

let fen=START, selected=null, legal=[], moves=[], ready=false, busy=false;
let searchResolve=null, searchLines=new Map(), fenResolve=null, legalResolve=null;
let worker;

function parseFen(f){
 const b={}; let rows=f.split(" ")[0].split("/");
 rows.forEach((row,r)=>{let file=0; for(const c of row){if(/\d/.test(c)) file+=+c; else {b[String.fromCharCode(97+file)+(8-r)]=c; file++;}}});
 return b;
}
function render(){
 const b=parseFen(fen); board.innerHTML="";
 for(let rank=8;rank>=1;rank--) for(let file=0;file<8;file++){
  const sq=String.fromCharCode(97+file)+rank;
  const el=document.createElement("div");
  el.className="square "+(((file+rank)%2)?"light":"dark");
  if(selected===sq) el.classList.add("selected");
  const destinations=legal.filter(m=>m.startsWith(selected||"") && m.slice(2,4)===sq);
  if(destinations.length) el.classList.add(b[sq]?"capture":"target");
  const sp=document.createElement("span"); sp.className="piece"; sp.textContent=PIECE[b[sq]]||""; el.appendChild(sp);
  el.addEventListener("click",()=>clickSquare(sq,b[sq]));
  board.appendChild(el);
 }
}
function send(s){worker.postMessage(s)}
function setPos(){send(moves.length?"position startpos moves "+moves.join(" "):"position startpos")}

function requestFen(){
 return new Promise(resolve=>{fenResolve=resolve; send("d")});
}
function requestLegalMoves(){
 return new Promise(resolve=>{
  legalResolve=resolve; searchLines.clear(); setPos(); send("go depth 1");
 });
}
function searchAll(){
 return new Promise(resolve=>{
  searchResolve=resolve; searchLines.clear(); setPos();
  send("setoption name MultiPV value 218");
  send("go depth "+depth.value);
 });
}

try{
 // IMPORTANT: this exact Stockfish 18 worker expects stockfish.wasm by default.
 // Passing the WASM URL in the worker hash tells it to use the user's existing filename.
 const wasmURL=new URL("./stockfish-18-lite-single.wasm",location.href).href;
 worker=new Worker("./stockfish-18-lite-single.js#"+encodeURIComponent(wasmURL)+",worker");
 worker.onmessage=e=>{
  const s=String(e.data);
  if(s==="uciok"){send("isready");return}
  if(s==="readyok"&&!ready){
    ready=true; mode.textContent="READY"; status.textContent="Ready! Click a White piece."; refresh().then(requestLegalMoves); return;
  }
  let m=s.match(/^Fen:\s*(.+)$/);
  if(m&&fenResolve){let r=fenResolve;fenResolve=null;r(m[1]);return}
  m=s.match(/multipv\s+(\d+).*?\sscore\s+(cp|mate)\s+(-?\d+).*?\spv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
  if(m) searchLines.set(+m[1],{move:m[4],scoreType:m[2],score:+m[3]});
  if(s.startsWith("bestmove ")){
    if(searchResolve){let r=searchResolve;searchResolve=null;r([...searchLines.entries()].sort((a,b)=>a[0]-b[0]).map(x=>x[1]));}
    else if(legalResolve){let r=legalResolve;legalResolve=null;r([...searchLines.values()].map(x=>x.move));}
  }
 };
 worker.onerror=e=>{status.textContent="Stockfish failed to load: "+e.message;mode.textContent="ERROR"};
 send("uci");
}catch(e){status.textContent="Could not create Stockfish worker: "+e.message;mode.textContent="ERROR"}

async function refresh(){
 setPos(); fen=await requestFen(); render();
}
async function updateLegal(){
 legal=await requestLegalMoves(); render();
}
async function clickSquare(sq,p){
 if(!ready||busy) return;
 const turn=fen.split(" ")[1]; if(turn!=="w") return;
 if(!selected){
  if(p&&p===p.toUpperCase()){selected=sq;await updateLegal();}
  return;
 }
 if(sq===selected){selected=null;legal=[];render();return}
 let matches=legal.filter(m=>m.startsWith(selected+sq));
 if(!matches.length){
  if(p&&p===p.toUpperCase()){selected=sq;await updateLegal()} else {selected=null;render()}
  return;
 }
 let mv=matches.find(x=>x.endsWith("q"))||matches[0];
 selected=null;legal=[];busy=true;moves.push(mv);await refresh();status.textContent="Engine thinking…";await engineMove();
}
async function engineMove(){
 let candidates=await searchAll();
 if(!candidates.length){busy=false;status.textContent="Game over.";return}
 const worst=Math.random()<Number(chance.value)/100;
 const pick=worst?candidates[candidates.length-1]:candidates[0];
 mode.textContent=worst?"WORSTFISH":"STOCKFISH";mode.className="badge "+(worst?"bad":"good");
 moves.push(pick.move);await refresh();busy=false;
 status.textContent=(worst?"🎲 Worstfish":"🐟 Stockfish")+" played "+pick.move+". Your move.";
 await updateLegal();
}
document.getElementById("reset").onclick=async()=>{
 if(!ready)return;busy=false;selected=null;legal=[];moves=[];send("stop");send("ucinewgame");setPos();await refresh();await updateLegal();
 mode.textContent="READY";mode.className="badge";status.textContent="New game. You are White.";
};
render();
</script>
</body>
</html>
