<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50% Stockfish + 50% Worstfish</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f4f6f8;font-family:system-ui,-apple-system,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}
h1{margin:0 0 6px}.muted{color:#aab3bd}
.layout{display:grid;grid-template-columns:minmax(300px,620px) 1fr;gap:22px;align-items:start}
.panel{background:#191e25;border:1px solid #303844;border-radius:18px;padding:16px}
.board-wrap{width:min(90vw,600px);aspect-ratio:1/1;margin:auto}
#board{
 width:100%;height:100%;display:grid;
 grid-template-columns:repeat(8,minmax(0,1fr));
 grid-template-rows:repeat(8,minmax(0,1fr));
 border:4px solid #3a424d;overflow:hidden;border-radius:10px
}
.square{
 width:100%;height:100%;min-width:0;min-height:0;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative;user-select:none;cursor:pointer;
 font-size:clamp(27px,6vw,57px);line-height:1
}
.light{background:#eee0c4}.dark{background:#76906f}
.selected{box-shadow:inset 0 0 0 5px #ffd35a}
.target::after{content:"";width:20%;height:20%;border-radius:50%;background:#1118;position:absolute;pointer-events:none}
.capture::after{content:"";inset:7%;border:5px solid #1118;border-radius:50%;position:absolute;pointer-events:none}
.piece{pointer-events:auto;max-width:80%;max-height:80%;line-height:1;cursor:grab}
.piece:active{cursor:grabbing}
.controls{display:grid;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
input[type=range]{width:100%}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
#reset{background:#69d69a;color:#07130c}
.status{padding:13px;background:#0d1116;border-radius:12px;min-height:92px;line-height:1.45}
.badge{padding:6px 10px;border-radius:999px;background:#303844;font-weight:800}
.good{color:#80e5a8;background:#173728}.bad{color:#ff9eac;background:#44232a}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🐟 Stockfish + Worstfish 🎲</h1>
<p class="muted">You are White. 50% genius, 50% catastrophe.</p>

<div class="layout">
 <section class="panel">
   <div class="board-wrap"><div id="board"></div></div>
 </section>

 <section class="panel controls">
  <div>
    <div class="row"><b>Worstfish chance</b><b id="chanceText">50%</b></div>
    <input id="chance" type="range" min="0" max="100" value="50">
  </div>

  <div>
    <div class="row"><b>Depth</b><b id="depthText">10</b></div>
    <input id="depth" type="range" min="5" max="16" value="10">
  </div>

  <div class="row"><span>Mode</span><span id="mode" class="badge">LOADING</span></div>
  <div id="status" class="status">Starting Stockfish…</div>
  <button id="reset">New Game</button>
  <div class="muted">Click-to-move and drag-and-drop both work. Squares are permanently fixed to an 8×8 grid.</div>
 </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script>
const PIECE={
 w:{p:"♙",n:"♘",b:"♗",r:"♖",q:"♕",k:"♔"},
 b:{p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"}
};

const board=document.getElementById("board");
const statusEl=document.getElementById("status");
const modeEl=document.getElementById("mode");
const chance=document.getElementById("chance");
const depth=document.getElementById("depth");

chance.oninput=()=>document.getElementById("chanceText").textContent=chance.value+"%";
depth.oninput=()=>document.getElementById("depthText").textContent=depth.value;

const game=new Chess();
let selected=null;
let ready=false;
let busy=false;
let worker=null;
let dragFrom=null;

let searchResolve=null;
let searchLines=new Map();

function legalFrom(square){
 return game.moves({square,verbose:true});
}

function render(){
 board.innerHTML="";
 const state=game.board();

 for(let r=0;r<8;r++){
  for(let f=0;f<8;f++){
   const rank=8-r;
   const file=String.fromCharCode(97+f);
   const sq=file+rank;
   const p=state[r][f];

   const el=document.createElement("div");
   el.dataset.square=sq;
   el.className="square "+(((f+rank)%2)?"light":"dark");

   if(selected===sq) el.classList.add("selected");

   if(selected){
    const legal=legalFrom(selected);
    if(legal.some(m=>m.to===sq)){
      el.classList.add(p?"capture":"target");
    }
   }

   if(p){
    const sp=document.createElement("span");
    sp.className="piece";
    sp.textContent=PIECE[p.color][p.type];
    sp.draggable=(p.color==="w" && game.turn()==="w" && !busy);
    sp.dataset.square=sq;

    sp.addEventListener("dragstart",e=>{
      if(busy||!ready||game.turn()!=="w"||p.color!=="w"){e.preventDefault();return;}
      dragFrom=sq;
      selected=sq;
      e.dataTransfer.setData("text/plain",sq);
      e.dataTransfer.effectAllowed="move";
      render();
    });

    sp.addEventListener("dragend",()=>{
      dragFrom=null;
    });

    el.appendChild(sp);
   }

   el.addEventListener("dragover",e=>{
    if(dragFrom){e.preventDefault();e.dataTransfer.dropEffect="move";}
   });

   el.addEventListener("drop",e=>{
    e.preventDefault();
    const from=e.dataTransfer.getData("text/plain")||dragFrom;
    if(from) tryHumanMove(from,sq);
    dragFrom=null;
   });

   el.addEventListener("click",()=>clickSquare(sq,p));
   board.appendChild(el);
  }
 }
}

function setMode(text,cls=""){
 modeEl.textContent=text;
 modeEl.className="badge"+(cls?" "+cls:"");
}

function clickSquare(sq,p){
 if(!ready||busy||game.turn()!=="w")return;

 if(!selected){
  if(p&&p.color==="w"){
   selected=sq;
   render();
  }
  return;
 }

 if(sq===selected){
  selected=null;
  render();
  return;
 }

 const ownPiece=p&&p.color==="w";
 if(ownPiece){
  selected=sq;
  render();
  return;
 }

 tryHumanMove(selected,sq);
}

async function tryHumanMove(from,to){
 if(!ready||busy||game.turn()!=="w")return;

 const legal=legalFrom(from);
 const candidate=legal.find(m=>m.to===to && (!m.promotion || m.promotion==="q")) ||
                 legal.find(m=>m.to===to);

 if(!candidate){
  selected=null;
  render();
  return;
 }

 const move=game.move({
  from,
  to,
  promotion:candidate.promotion||"q"
 });

 if(!move){
  selected=null;
  render();
  return;
 }

 selected=null;
 busy=true;
 render();

 if(game.game_over()){
  finishGame();
  busy=false;
  return;
 }

 statusEl.textContent="Engine thinking…";
 await engineMove();
}

function finishGame(){
 if(game.in_checkmate()){
  statusEl.textContent=(game.turn()==="w"?"Black":"White")+" wins by checkmate.";
 }else if(game.in_draw()){
  statusEl.textContent="Draw.";
 }else{
  statusEl.textContent="Game over.";
 }
}

function send(cmd){worker.postMessage(cmd)}

function analyzeAll(){
 return new Promise(resolve=>{
  searchResolve=resolve;
  searchLines=new Map();

  send("position fen "+game.fen());
  send("setoption name MultiPV value 218");
  send("go depth "+depth.value);
 });
}

async function engineMove(){
 const candidates=await analyzeAll();

 if(!candidates.length){
  busy=false;
  finishGame();
  return;
 }

 const useWorst=Math.random() < Number(chance.value)/100;
 const choice=useWorst ? candidates[candidates.length-1] : candidates[0];

 const move=game.move(choice.move,{sloppy:true});

 if(!move){
  console.error("Engine returned move that chess.js rejected:",choice.move);
  busy=false;
  statusEl.textContent="Engine returned an invalid move: "+choice.move;
  return;
 }

 setMode(useWorst?"WORSTFISH":"STOCKFISH",useWorst?"bad":"good");
 render();

 if(game.game_over()){
  finishGame();
 }else{
  statusEl.textContent=(useWorst?"🎲 Worstfish":"🐟 Stockfish")+" played "+choice.move+". Your move.";
 }

 busy=false;
 render();
}

function startEngine(){
 try{
  worker=new Worker("./stockfish-18-lite-single.js");

  worker.addEventListener("error",e=>{
   console.error("Stockfish worker error:",e);
   setMode("ERROR");
   statusEl.textContent="Stockfish worker error: "+(e.message||"unknown error");
  });

  worker.addEventListener("message",e=>{
   const s=String(e.data);
   console.log("[Stockfish]",s);

   if(s==="uciok"){
    send("isready");
    return;
   }

   if(s==="readyok"&&!ready){
    ready=true;
    setMode("READY");
    statusEl.textContent="Stockfish loaded. You are White.";
    render();
    return;
   }

   const m=s.match(/multipv\s+(\d+).*?\sscore\s+(cp|mate)\s+(-?\d+).*?\spv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
   if(m){
    searchLines.set(Number(m[1]),{
     move:m[4],
     scoreType:m[2],
     score:Number(m[3])
    });
   }

   if(s.startsWith("bestmove ")&&searchResolve){
    const ordered=[...searchLines.entries()]
      .sort((a,b)=>a[0]-b[0])
      .map(x=>x[1]);

    const r=searchResolve;
    searchResolve=null;
    r(ordered);
   }
  });

  send("uci");
 }catch(err){
  console.error(err);
  setMode("ERROR");
  statusEl.textContent="Could not start Stockfish: "+err.message;
 }
}

document.getElementById("reset").addEventListener("click",()=>{
 game.reset();
 selected=null;
 busy=false;
 send("stop");
 send("ucinewgame");
 setMode(ready?"READY":"LOADING");
 statusEl.textContent=ready?"New game. You are White.":"Starting Stockfish…";
 render();
});

render();
startEngine();
</script>
</body>
</html>
