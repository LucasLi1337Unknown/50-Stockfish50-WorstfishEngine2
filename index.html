<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50% Stockfish + 50% Worstfish</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#f4f6f8;font-family:system-ui,-apple-system,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}
h1{margin:0 0 6px}.muted{color:#aab3bd}
.layout{display:grid;grid-template-columns:minmax(300px,620px) 1fr;gap:22px;align-items:start}
.panel{background:#191e25;border:1px solid #303844;border-radius:18px;padding:16px}
.board-wrap{width:min(90vw,600px);aspect-ratio:1/1;margin:auto}
#board{
 width:100%;height:100%;display:grid;
 grid-template-columns:repeat(8,minmax(0,1fr));
 grid-template-rows:repeat(8,minmax(0,1fr));
 border:4px solid #3a424d;overflow:hidden;border-radius:10px
}
.square{
 width:100%;height:100%;min-width:0;min-height:0;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative;user-select:none;cursor:pointer;
 font-size:clamp(27px,6vw,57px);line-height:1
}
.light{background:#eee0c4}.dark{background:#76906f}
.selected{box-shadow:inset 0 0 0 5px #ffd35a}
.target::after{content:"";width:20%;height:20%;border-radius:50%;background:#1118;position:absolute}
.capture::after{content:"";inset:7%;border:5px solid #1118;border-radius:50%;position:absolute}
.piece{pointer-events:none;max-width:80%;max-height:80%;line-height:1}
.controls{display:grid;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
input[type=range]{width:100%}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
#reset{background:#69d69a;color:#07130c}
.status{padding:13px;background:#0d1116;border-radius:12px;min-height:92px;line-height:1.45}
.badge{padding:6px 10px;border-radius:999px;background:#303844;font-weight:800}
.good{color:#80e5a8;background:#173728}.bad{color:#ff9eac;background:#44232a}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🐟 Stockfish + Worstfish 🎲</h1>
<p class="muted">You are White. The engine is either brilliant or catastrophically bad.</p>

<div class="layout">
 <section class="panel">
   <div class="board-wrap"><div id="board"></div></div>
 </section>
 <section class="panel controls">
  <div>
    <div class="row"><b>Worstfish chance</b><b id="chanceText">50%</b></div>
    <input id="chance" type="range" min="0" max="100" value="50">
  </div>
  <div>
    <div class="row"><b>Depth</b><b id="depthText">10</b></div>
    <input id="depth" type="range" min="5" max="16" value="10">
  </div>
  <div class="row"><span>Mode</span><span id="mode" class="badge">LOADING</span></div>
  <div id="status" class="status">Starting Stockfish…</div>
  <button id="reset">New Game</button>
  <div class="muted">Click a piece, then a highlighted destination. The board is a fixed 8×8 grid and pieces cannot resize squares.</div>
 </section>
</div>
</main>

<script>
const PIECE={P:"♙",N:"♘",B:"♗",R:"♖",Q:"♕",K:"♔",p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

const board=document.getElementById("board");
const statusEl=document.getElementById("status");
const modeEl=document.getElementById("mode");
const chance=document.getElementById("chance");
const depth=document.getElementById("depth");

chance.oninput=()=>document.getElementById("chanceText").textContent=chance.value+"%";
depth.oninput=()=>document.getElementById("depthText").textContent=depth.value;

let fen=START;
let moves=[];
let selected=null;
let legal=[];
let ready=false;
let busy=false;
let worker=null;

let diagResolve=null;
let diagFen=null;
let diagLegal=null;

let searchResolve=null;
let searchLines=new Map();

function parseFen(f){
  const b={};
  const rows=f.split(" ")[0].split("/");
  rows.forEach((row,r)=>{
    let file=0;
    for(const c of row){
      if(/\d/.test(c)) file+=Number(c);
      else{
        b[String.fromCharCode(97+file)+(8-r)]=c;
        file++;
      }
    }
  });
  return b;
}

function render(){
  const b=parseFen(fen);
  board.innerHTML="";
  for(let rank=8; rank>=1; rank--){
    for(let file=0; file<8; file++){
      const sq=String.fromCharCode(97+file)+rank;
      const el=document.createElement("div");
      el.className="square "+(((file+rank)%2)?"light":"dark");
      if(selected===sq) el.classList.add("selected");

      const canGo=legal.some(m=>m.slice(0,2)===selected && m.slice(2,4)===sq);
      if(canGo) el.classList.add(b[sq]?"capture":"target");

      const sp=document.createElement("span");
      sp.className="piece";
      sp.textContent=PIECE[b[sq]]||"";
      el.appendChild(sp);

      el.addEventListener("click",()=>clickSquare(sq,b[sq]));
      board.appendChild(el);
    }
  }
}

function send(cmd){ worker.postMessage(cmd); }

function setPosition(){
  send(moves.length ? "position startpos moves "+moves.join(" ") : "position startpos");
}

function diagnostics(){
  return new Promise(resolve=>{
    diagResolve=resolve;
    diagFen=null;
    diagLegal=null;
    setPosition();
    send("d");
  });
}

function analyzeAll(){
  return new Promise(resolve=>{
    searchResolve=resolve;
    searchLines=new Map();
    setPosition();
    send("setoption name MultiPV value 218");
    send("go depth "+depth.value);
  });
}

function finishDiagnosticsIfReady(){
  if(diagResolve && diagFen && Array.isArray(diagLegal)){
    const r=diagResolve;
    diagResolve=null;
    r({fen:diagFen,legal:diagLegal});
  }
}

async function refreshPosition(){
  const d=await diagnostics();
  fen=d.fen;
  legal=d.legal;
  render();
}

function startEngine(){
  try{
    /*
      IMPORTANT FIX:
      Stockfish.js 18 expects the worker URL in this form:

      stockfish-18-lite-single.js#stockfish-18-lite-single.wasm

      The previous version incorrectly added ",worker" and encoded the WASM URL,
      so the engine never reached its WASM-loading path.
    */
    worker=new Worker("./stockfish-18-lite-single.js#./stockfish-18-lite-single.wasm");

    worker.onerror=(e)=>{
      modeEl.textContent="ERROR";
      statusEl.textContent="Stockfish worker error: "+(e.message||"unknown worker error");
      console.error("Stockfish worker error:",e);
    };

    worker.onmessage=(e)=>{
      const s=String(e.data);
      console.log("[Stockfish]",s);

      if(s==="uciok"){
        send("isready");
        return;
      }

      if(s==="readyok" && !ready){
        ready=true;
        modeEl.textContent="READY";
        statusEl.textContent="Stockfish loaded. You are White.";
        refreshPosition();
        return;
      }

      let m=s.match(/^Fen:\s*(.+)$/i);
      if(m){
        diagFen=m[1].trim();
        finishDiagnosticsIfReady();
      }

      m=s.match(/^Legal uci moves:\s*(.*)$/i);
      if(m){
        diagLegal=m[1].trim() ? m[1].trim().split(/\s+/) : [];
        finishDiagnosticsIfReady();
      }

      m=s.match(/multipv\s+(\d+).*?\sscore\s+(cp|mate)\s+(-?\d+).*?\spv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
      if(m){
        searchLines.set(Number(m[1]),{
          move:m[4],
          scoreType:m[2],
          score:Number(m[3])
        });
      }

      if(s.startsWith("bestmove ") && searchResolve){
        const ordered=[...searchLines.entries()]
          .sort((a,b)=>a[0]-b[0])
          .map(x=>x[1]);

        const r=searchResolve;
        searchResolve=null;
        r(ordered);
      }
    };

    send("uci");

    setTimeout(()=>{
      if(!ready){
        statusEl.textContent="Stockfish still has not answered. Open DevTools → Network and check whether the .wasm request appears.";
      }
    },10000);

  }catch(err){
    modeEl.textContent="ERROR";
    statusEl.textContent="Could not start Stockfish: "+err.message;
  }
}

async function clickSquare(sq,p){
  if(!ready || busy) return;
  if(fen.split(" ")[1]!=="w") return;

  if(!selected){
    if(p && p===p.toUpperCase()){
      selected=sq;
      render();
    }
    return;
  }

  if(sq===selected){
    selected=null;
    render();
    return;
  }

  const matches=legal.filter(m=>m.slice(0,2)===selected && m.slice(2,4)===sq);

  if(!matches.length){
    if(p && p===p.toUpperCase()){
      selected=sq;
      render();
    }else{
      selected=null;
      render();
    }
    return;
  }

  const mv=matches.find(m=>m.endsWith("q")) || matches[0];
  selected=null;
  busy=true;
  moves.push(mv);

  await refreshPosition();
  statusEl.textContent="Engine thinking…";

  await engineMove();
}

async function engineMove(){
  const candidates=await analyzeAll();

  if(!candidates.length){
    busy=false;
    await refreshPosition();
    statusEl.textContent=legal.length ? "Engine returned no candidates." : "Game over.";
    return;
  }

  const useWorst=Math.random() < Number(chance.value)/100;
  const choice=useWorst ? candidates[candidates.length-1] : candidates[0];

  modeEl.textContent=useWorst ? "WORSTFISH" : "STOCKFISH";
  modeEl.className="badge "+(useWorst ? "bad" : "good");

  moves.push(choice.move);
  await refreshPosition();

  busy=false;
  statusEl.textContent=(useWorst?"🎲 Worstfish":"🐟 Stockfish")+" played "+choice.move+". Your move.";
}

document.getElementById("reset").addEventListener("click",async()=>{
  if(!ready) return;
  busy=false;
  selected=null;
  moves=[];
  send("stop");
  send("ucinewgame");
  await refreshPosition();
  modeEl.textContent="READY";
  modeEl.className="badge";
  statusEl.textContent="New game. You are White.";
});

render();
startEngine();
</script>
</body>
</html>
